services:
  proxy:
    build: .
    image: shiftrelay:local
    restart: unless-stopped
    init: true
    ports: ["${SHIFTRELAY_BIND:-127.0.0.1}:8080:8080"]
    environment:
      SHIFTRELAY_PROXY_AUTH: ${SHIFTRELAY_PROXY_AUTH:?Run scripts/setup.py}
    volumes:
      - ca:/ca
      - public:/public
      - status:/status
      - ./config:/config:ro
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
  portal:
    build: .
    image: shiftrelay:local
    command: ["python", "-m", "shiftrelay.portal"]
    restart: unless-stopped
    init: true
    ports: ["${SHIFTRELAY_BIND:-127.0.0.1}:8787:8787"]
    environment:
      SHIFTRELAY_ADMIN_KEY: ${SHIFTRELAY_ADMIN_KEY:?Run scripts/setup.py}
    volumes:
      - public:/public:ro
      - status:/status:ro
      - ./config:/config:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 128m
    depends_on: [proxy]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz',timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}
volumes:
  ca:
  public:
  status:
