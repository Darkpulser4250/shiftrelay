name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt -r research.txt -r bridges/youtube_tv/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=bridges/youtube_tv python -m unittest discover -s bridges/youtube_tv/tests -v
      - run: pip check
  android-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Ensure pinned Android SDK components
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify native probe APK
        run: python3 scripts/build_android_probe.py
      - uses: actions/upload-artifact@v7
        with:
          name: shiftrelay-android-probe
          path: |
            artifacts/shiftrelay-probe.apk
            artifacts/shiftrelay-probe.apk.sha256
          retention-days: 30
  image:
    needs: tests
    env:
      SHIFTRELAY_ADMIN_KEY: ci-only-admin-00000000000000000000000000000000
      SHIFTRELAY_PROXY_AUTH: ci:ci-only-proxy-00000000000000000000000000000000
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t shiftrelay:local .
      - run: docker build -t shiftrelay-youtube-tv:local bridges/youtube_tv
      - name: Container imports
        run: docker run --rm --read-only --entrypoint python shiftrelay:local -c 'import shiftrelay.launch, shiftrelay.portal; print("imports ok")'
      - name: Start actual Compose services
        run: docker compose --profile youtube-tv up -d --no-build --wait --wait-timeout 90
      - name: Check native bridge is unpaired, passive and isolated from the core
        run: |
          docker compose --profile youtube-tv exec -T youtube-tv python -m ytbridge.cli doctor
          docker compose exec -T portal python - <<'PY'
          import importlib.util, json, os, urllib.request
          assert importlib.util.find_spec('pyytlounge') is None
          request = urllib.request.Request('http://127.0.0.1:8787/v1/native-status', headers={'Authorization':'Bearer '+os.environ['SHIFTRELAY_ADMIN_KEY']})
          with urllib.request.urlopen(request, timeout=3) as response:
              native = json.load(response)['youtube_tv']
          assert native['reason'] == 'awaiting_pairing'
          assert native['mode'] == 'observe' and native['connected'] is False
          assert native['counters']['lower_requests'] == 0
          assert native['counters']['skip_requests'] == 0
          print('Native bridge is passive and its private library is isolated from the core')
          PY
      - name: Check enrolled public CA and authenticated proxy forwarding
        run: |
          docker compose exec -T portal python -c 'from pathlib import Path; c=Path("/public/shiftrelay-ca.crt").read_text(); assert "BEGIN CERTIFICATE" in c and "PRIVATE KEY" not in c; assert not Path("/ca/mitmproxy-ca.pem").exists()'
          docker compose exec -T proxy python - <<'PY'
          import base64, http.client, json, os
          auth = base64.b64encode(os.environ['SHIFTRELAY_PROXY_AUTH'].encode()).decode()
          connection = http.client.HTTPConnection('127.0.0.1', 8080, timeout=5)
          connection.request('GET', 'http://portal:8787/healthz', headers={'Proxy-Authorization': 'Basic ' + auth})
          response = connection.getresponse()
          assert response.status == 200
          assert json.loads(response.read())['status'] == 'ok'
          connection.close()
          print('Compose proxy forwarding and public certificate isolation passed')
          PY
      - name: Start the independent Android test server
        run: docker compose -f compose.android.yaml up -d --no-build --wait --wait-timeout 90
      - name: Install reference kernel WireGuard client
        run: sudo apt-get update -qq && sudo apt-get install -y wireguard-tools
      - name: Test actual WireGuard packets, DNS and HTTPS blocking
        run: python3 scripts/test_android_wireguard.py
      - name: Show service logs if startup failed
        if: failure()
        run: |
          docker compose --profile youtube-tv logs --no-color
          docker compose -f compose.android.yaml logs --no-color
      - name: Clean up disposable CI services
        if: always()
        run: |
          docker compose --profile youtube-tv down -v
          docker compose -f compose.android.yaml down -v
